version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dipendenze:
        patterns: ["*"]
    ignore:
      # @astrojs/check 0.9.10 accetta solo TypeScript 5 o 6.
      # Togliere quando supporterà TypeScript 7 (promemoria nel diario).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Il progetto gira su Node 24: i tipi restano alla 24 (Pietro, 2026-10-02)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
